server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: chatbot-bem-nascer
  datasource:
    url: ${BOT_DATABASE_URL:jdbc:h2:file:./data/chatbot;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ""
  sql:
    init:
      mode: always

bot:
  allowed-numbers: ${BOT_ALLOWED_NUMBERS:}
  retention: 7d
  greeting-idle: 24h
  max-contact-messages: 200
  max-total-messages: 2000
  context-messages: 12
  context-characters: 8000
  max-text-characters: 2000
  max-pending-events: 2000

ai:
  enabled: ${AI_ENABLED:true}
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen3:4b}
  timeout: ${AI_TIMEOUT:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info

bem-nascer:
  nome: "Maternidade Bem Nascer"
  documentos:
    paciente:
      - "RG"
      - "CPF"
      - "Cartão do SUS"
    acompanhante:
      - "RG"
      - "CPF"
  visitas:
    inicio: "15h"
    fim: "17h"
    regras:
      - "Não é permitido entrar com capacete."
      - "Não é permitido levar comida."
      - "Na troca de acompanhante, deve ser levada roupa para a paciente."
  funcionamento:
    administrativo-inicio: "8h"
    administrativo-fim: "18h"
    # Informação ainda não fornecida pela maternidade. Não inventar resposta.
    atendimento-24h: ""

evolution:
  base-url: ${EVOLUTION_BASE_URL:http://localhost:8080}
  api-key: ${EVOLUTION_API_KEY:}
  instance: ${EVOLUTION_INSTANCE:MZN-LOCAL}
  send-enabled: ${EVOLUTION_SEND_ENABLED:false}
